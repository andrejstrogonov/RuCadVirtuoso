<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:743px;height:575px;background:#000000;" width="743px" height="575px" viewBox="0 0 743 575" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="5" y="17" fill="#33FF02" font-size="12" textLength="448.102" font-weight="700" font-style="italic">PlantUML version 1.2026.10 / a00edda [2026-11-11 11:04:35 UTC]</text><rect x="5" y="26.969" width="732.519" height="21.297" fill="#33FF02" style="stroke:#33FF02;stroke-width:1;"/><text x="6" y="41.969" fill="#000" font-size="14" textLength="312.519" font-weight="700">[From 22_act_dc_sweep.puml (line 30) ]</text><text x="5" y="62.266" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="78.563" fill="#33FF02" font-size="14" textLength="193.334" font-weight="700">@startuml act_dc_sweep</text><text x="5" y="94.859" fill="#33FF02" font-size="14" textLength="602.212" font-weight="700">title Деятельность: DC-sweep (1-2 вложенных параметра) — ТЗ 7.6, FR-DC</text><text x="5" y="111.156" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="127.453" fill="#33FF02" font-size="14" textLength="38.069" font-weight="700">start</text><text x="5" y="143.75" fill="#33FF02" font-size="14" textLength="691.66" font-weight="700">:Разобрать DcSpec: источники, start/stop/step\n(внешний цикл — первый параметр);</text><text x="5" y="160.047" fill="#33FF02" font-size="14" textLength="258.139" font-weight="700">:OP в стартовой точке → x_prev;</text><text x="5" y="176.344" fill="#33FF02" font-size="14" textLength="146.733" font-weight="700">:warning_list := [];</text><text x="5" y="192.641" fill="#33FF02" font-size="14" textLength="338.604" font-weight="700">while (точки внешнего параметра) is (да)</text><text x="14.748" y="208.938" fill="#33FF02" font-size="14" textLength="321.152" font-weight="700">:Задать значение внешнего источника;</text><text x="14.748" y="225.234" fill="#33FF02" font-size="14" textLength="360.671" font-weight="700">while (точки внутреннего параметра) is (да)</text><text x="24.496" y="241.531" fill="#33FF02" font-size="14" textLength="343.219" font-weight="700">:Задать значение внутреннего источника;</text><text x="24.496" y="257.828" fill="#33FF02" font-size="14" textLength="616.868" font-weight="700">:Решить систему при\nтекущем состоянии приборов (SV не сбрасываются);</text><text x="24.496" y="274.125" fill="#33FF02" font-size="14" textLength="217.021" font-weight="700">if (сходимость?) then (нет)</text><text x="34.244" y="290.422" fill="#33FF02" font-size="14" textLength="703.274" font-weight="700">:Стратегии: gmin-stepping →\nдемпфирование → source stepping →\n pseudo-transient;</text><text x="34.244" y="306.719" fill="#33FF02" font-size="14" textLength="312.717" font-weight="700">if (сходимость достигнута?) then (нет)</text><text x="43.992" y="323.016" fill="#33FF02" font-size="14" textLength="260.046" font-weight="700">:ConvergenceError(узел, точка);</text><text x="43.992" y="339.313" fill="#33FF02" font-size="14" textLength="34.665" font-weight="700">stop</text><text x="34.244" y="355.609" fill="#33FF02" font-size="14" textLength="40.373" font-weight="700">endif</text><text x="24.496" y="371.906" fill="#33FF02" font-size="14" textLength="40.373" font-weight="700">endif</text><text x="24.496" y="388.203" fill="#33FF02" font-size="14" textLength="326.478" font-weight="700">if (скачок решения > порога?) then (да)</text><text x="34.244" y="404.5" fill="#33FF02" font-size="14" textLength="436.68" font-weight="700">:W_DC_DISCONTINUITY\n(переключение мемристора);</text><text x="34.244" y="420.797" fill="#33FF02" font-size="14" textLength="257.223" font-weight="700">:Добавить warning в результат;</text><text x="24.496" y="437.094" fill="#33FF02" font-size="14" textLength="40.373" font-weight="700">endif</text><text x="24.496" y="453.391" fill="#33FF02" font-size="14" textLength="482.364" font-weight="700">:Записать точку в Result\n(источники, узлы, токи, @inst.x);</text><text x="14.748" y="469.688" fill="#33FF02" font-size="14" textLength="71.477" font-weight="700">endwhile</text><text x="5" y="485.984" fill="#33FF02" font-size="14" textLength="71.477" font-weight="700">endwhile</text><text x="5" y="502.281" fill="#33FF02" font-size="14" textLength="276.063" font-weight="700">:Result(axis=параметр, series=N);</text><text x="5" y="518.578" fill="#33FF02" font-size="14" textLength="34.665" font-weight="700">stop</text><text x="5" y="534.875" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="551.172" fill="#33FF02" font-size="14" textLength="97.877" font-weight="700" text-decoration="wavy underline">note bottom</text><text x="9.874" y="567.469" fill="#F00" font-size="14" textLength="376.243" font-weight="700">Syntax Error? (Assumed diagram type: activity)</text><?plantuml-src ZLJRIXjH57sVhzYF2IJM5jh21Dj2qe8lMhGNIYrYzQW3EWapu-KnYRSMfO88ljf-GOo9JdFp5_Rv1R-aQvypfb4Z-A8dS_PUUvsrrzwH5wqeucDkwaDTvIQtzG5tkQShkgeFN2hai-66KYLAFSq-8wvpctjyWRWkT_M-tY6-ufekSuqxWAZAAKtNvMFYFtn2BqTUPEZTLBQGTvmmcWiYn-LJn5u2v4nYfGWLvgTBQjubZgKgQky1FUOMnnaoMK_2g5Z27rMQyLFWq4Mf7oRcB-bT4zgsHQzmK-QwtiVDNMRfdEDEliSRo9J1dHG3N4zWRDqMD-bwzuWsPqk1MaV2nbpWU_xIx8eNHkIEqTTlEMTZsODcgNvAJ0EScdpElQ6gU26bk86JG-Jo2IuRYG3GeulZdf4r1eNxU7UbgUM0Cfo8tZ8LJOiUIUTHX8RX3gKbQAU6VcpGT2M9Qt97Ru4CKE8Pttne0VMdN4XKBq4xD6Xn4ibd-5IMJb5g-XD9SGcs_gcWrNNy_uLA5NsOjlMzHQXIqJj8QW2WS-FdrscAbfMFXukyLVjqeVlRgc8edKjjbvPMFJyhdYkX_sAA6HzWO0fMstYGOGJDh41Ych2u5imhkfr3fL2jBHIpKJ3dXvxoernIz26EX9zMY1XKZEfSUu0ugEUB_heAbfG_hzu6GJ58wIrq3tES-U_fMZhNJv1HIdueVy5RT6wVB2l9GMQFMoGTHoUD4VGXlH8lsNQS3zBg6mcKFiyMyhE5yUdyvCI7yOcFun--oDZQqMpAhA9R0zRg65-K-rug3_1riPcmAY1pFJ5JCf1cZ0Nk4k_5pZ83NStTUOrrzPL09yw-qKHyMASf5QwjHC9koEenGhRrlXNIVdlZ-M4qicdueOmPGAT_S2rUQcxJ2yVkpXnscGey5OvD8DjqmV6BaQBlnIWghWAFZoJGhDWRRGR5buq6Py1zMxP11XQUpyX8zEnSY8t0UOzhhY1Ar0Ktp3eqN2wnzFP5kcrvfHdCCjwP84b2pnJfqFqc