<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:585px;height:461px;background:#000000;" width="585px" height="461px" viewBox="0 0 585 461" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="5" y="17" fill="#33FF02" font-size="12" textLength="448.102" font-weight="700" font-style="italic">PlantUML version 1.2026.10 / a00edda [2026-11-11 11:04:35 UTC]</text><rect x="5" y="26.969" width="574.26" height="21.297" fill="#33FF02" style="stroke:#33FF02;stroke-width:1;"/><text x="6" y="41.969" fill="#000" font-size="14" textLength="325.917" font-weight="700">[From 28_act_ac_analysis.puml (line 23) ]</text><text x="5" y="62.266" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="78.563" fill="#33FF02" font-size="14" textLength="206.732" font-weight="700">@startuml act_ac_analysis</text><text x="5" y="94.859" fill="#33FF02" font-size="14" textLength="515.539" font-weight="700">title Деятельность: малосигнальный AC-анализ — ТЗ 7.7, FR-AC</text><text x="5" y="111.156" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="127.453" fill="#33FF02" font-size="14" textLength="38.069" font-weight="700">start</text><text x="5" y="143.75" fill="#33FF02" font-size="14" textLength="407.347" font-weight="700">:Взять рабочую точку OP\n(линеаризация в x_op);</text><text x="5" y="160.047" fill="#33FF02" font-size="14" textLength="315.137" font-weight="700">:Собрать G = ∂i/∂v и C = ∂q/∂v при x_op;</text><text x="5" y="176.344" fill="#33FF02" font-size="14" textLength="226.584" font-weight="700">if (OP не найден?) then (да)</text><text x="14.748" y="192.641" fill="#33FF02" font-size="14" textLength="323.784" font-weight="700">:ConvergenceError → AC не запускается;</text><text x="14.748" y="208.938" fill="#33FF02" font-size="14" textLength="34.665" font-weight="700">stop</text><text x="5" y="225.234" fill="#33FF02" font-size="14" textLength="70.547" font-weight="700">else (да)</text><text x="14.748" y="241.531" fill="#33FF02" font-size="14" textLength="235.259" font-weight="700">:Построить частотную сетку:</text><text x="14.748" y="257.828" fill="#33FF02" font-size="14" textLength="236.94" font-weight="700">dec (точек/декада) | oct | lin;</text><text x="14.748" y="274.125" fill="#33FF02" font-size="14" textLength="185.698" font-weight="700">while (f в сетке) is (да)</text><text x="24.496" y="290.422" fill="#33FF02" font-size="14" textLength="119.957" font-weight="700">:A := G + j·ω·C;</text><text x="24.496" y="306.719" fill="#33FF02" font-size="14" textLength="554.764" font-weight="700">:Решить комплексную систему\nA·v = b для каждого источника AC;</text><text x="24.496" y="323.016" fill="#33FF02" font-size="14" textLength="337.955" font-weight="700">:Вычислить комплексные токи приборов;</text><text x="24.496" y="339.313" fill="#33FF02" font-size="14" textLength="288.08" font-weight="700">:Записать точку (Re/Im, |H|, phase);</text><text x="14.748" y="355.609" fill="#33FF02" font-size="14" textLength="71.477" font-weight="700">endwhile</text><text x="14.748" y="371.906" fill="#33FF02" font-size="14" textLength="493.076" font-weight="700">:Result: модуль (dB) и фаза (deg)\nдля выбранных величин;</text><text x="14.748" y="388.203" fill="#33FF02" font-size="14" textLength="34.665" font-weight="700">stop</text><text x="5" y="404.5" fill="#33FF02" font-size="14" textLength="40.373" font-weight="700">endif</text><text x="5" y="420.797" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="437.094" fill="#33FF02" font-size="14" textLength="97.877" font-weight="700" text-decoration="wavy underline">note bottom</text><text x="9.874" y="453.391" fill="#F00" font-size="14" textLength="376.243" font-weight="700">Syntax Error? (Assumed diagram type: activity)</text><?plantuml-src TLFBJjjG4DtxAsPfgo51bIgaHAXAexuM5OX5LqW8aWku2ZPDJDf55daKGXLKL8J4i